# === SERVER CONFIGURATION ===
server.port=${SERVER_PORT:8080}

# === DATABASE CONFIGURATION ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/origin?useSSL=false&serverTimezone=Europe/Paris}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# === FLYWAY ===
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.encoding=UTF-8

# === TIMEZONE & LOCALE ===
spring.jackson.time-zone=Europe/Paris
spring.jackson.locale=fr_FR

# === DISCORD CONFIGURATION ===
discord.bot.token=${DISCORD_BOT_TOKEN:}
discord.guild.id=${DISCORD_GUILD_ID:670711708628811805}
discord.oauth.client-id=${DISCORD_OAUTH_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_OAUTH_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/discord/callback}
discord.oauth.frontend-success-url=${DISCORD_OAUTH_FRONTEND_SUCCESS_URL:http://localhost:4200/raids}
discord.oauth.frontend-denied-url=${DISCORD_OAUTH_FRONTEND_DENIED_URL:http://localhost:4200/login?denied=1}
discord.raidhelper.channel.1=${DISCORD_RAIDHELPER_CHANNEL_1:1402054085632331866}
discord.raidhelper.channel.2=${DISCORD_RAIDHELPER_CHANNEL_2:1246580238197063802}
discord.raidhelper.channel.3=${DISCORD_RAIDHELPER_CHANNEL_3:1246580285840293929}
discord.raidhelper.channel.4=${DISCORD_RAIDHELPER_CHANNEL_4:1246580433899098232}
discord.raidhelper.default-time=${DISCORD_RAIDHELPER_DEFAULT_TIME:20:45}
discord.raidhelper.messageIds=${DISCORD_RAIDHELPER_MESSAGE_IDS:123456789012345678,987654321098765432}

# === RAID COMPOSITION SETTINGS ===
raid.composition.auto-generate=true
raid.composition.schedule=0 0 10 * * *  # tous les jours a 10h
raid.composition.template.path=templates/composition_template.txt
raid.import.default-enabled=true
raid.import.default-day-of-week=THURSDAY
raid.import.default-hour=21
raid.import.default-minute=0
raid.import.default-timezone=Europe/Paris
raid.import.scheduler.poll-ms=60000
raid.missing-ping.next-week.cron=0 0 21 * * THU
raid.missing-ping.timezone=Europe/Paris

# === CORS / ACTUATOR ===
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# === LOGGING ===
logging.level.org.springframework=INFO
logging.level.com.origin=INFO
logging.charset.console=UTF-8
