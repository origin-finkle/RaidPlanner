services:
  db:
    image: mysql:8.4
    container_name: origin-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-origin}
      MYSQL_USER: ${MYSQL_USER:-origin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Europe/Paris}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+02:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: origin-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-origin}?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-origin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://planner.example.com}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI}
      DISCORD_OAUTH_FRONTEND_SUCCESS_URL: ${DISCORD_OAUTH_FRONTEND_SUCCESS_URL}
      DISCORD_OAUTH_FRONTEND_DENIED_URL: ${DISCORD_OAUTH_FRONTEND_DENIED_URL}
      DISCORD_OFFICER_AUDIT_CHANNEL_ID: ${DISCORD_OFFICER_AUDIT_CHANNEL_ID:-1391787392335347792}
      DISCORD_RAIDHELPER_CHANNEL_1: ${DISCORD_RAIDHELPER_CHANNEL_1}
      DISCORD_RAIDHELPER_CHANNEL_2: ${DISCORD_RAIDHELPER_CHANNEL_2}
      DISCORD_RAIDHELPER_CHANNEL_3: ${DISCORD_RAIDHELPER_CHANNEL_3}
      DISCORD_RAIDHELPER_CHANNEL_4: ${DISCORD_RAIDHELPER_CHANNEL_4}
      DISCORD_RAIDHELPER_DEFAULT_TIME: ${DISCORD_RAIDHELPER_DEFAULT_TIME:-20:45}
      DISCORD_RAIDHELPER_MESSAGE_IDS: ${DISCORD_RAIDHELPER_MESSAGE_IDS:-}
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      start_period: 240s
      interval: 15s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./raid-planner-ui
      dockerfile: Dockerfile
    container_name: origin-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8081}:80"
    environment:
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  monitoring:
    image: louislam/uptime-kuma:1
    container_name: origin-monitoring
    restart: unless-stopped
    ports:
      - "${MONITORING_BIND:-127.0.0.1:3001}:3001"
    volumes:
      - uptime-kuma:/app/data
    environment:
      TZ: ${TZ:-Europe/Paris}

volumes:
  mysql-data:
  uptime-kuma:
